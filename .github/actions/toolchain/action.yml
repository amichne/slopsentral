name: Provision pinned tools
description: >-
  Fetch the checksum-pinned tools in tools/toolchain.json and expose them to later
  steps. Replaces a version manager: uv, Pkl, and Vale resolve from one manifest.
inputs:
  profile:
    description: Toolchain profile, core or ci.
    default: core
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        python3 tools/toolchain.py fetch --profile "$PROFILE"
        python3 tools/toolchain.py env --profile "$PROFILE" >> "$GITHUB_ENV"
        python3 tools/toolchain.py paths --profile "$PROFILE" >> "$GITHUB_PATH"
