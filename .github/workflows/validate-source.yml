name: Validate Source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Set up locked Python and schema tools
        run: uv run --locked tools/setup.py
      - name: Install checksum-verified native tools
        run: uv run --locked tools/ci.py native
      - name: Validate source, Python, schemas, and retained contracts
        run: uv run --locked tools/ci.py validate
      - name: Run all Python unit checks
        run: uv run --locked tools/ci.py unit
      - name: Compile Kotlin concepts and forbidden calls
        run: uv run --locked tools/ci.py kotlin
      - name: Validate Pkl facade against native Pkl
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked tools/ci.py pkl
      - name: Project all three harnesses and execute installed adapter contracts
        run: uv run --locked tools/verify_marketplaces.py
