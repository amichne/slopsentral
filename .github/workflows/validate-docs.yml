name: Validate Documentation

on:
  pull_request:
    paths:
      - docs/**
      - package.json
      - package-lock.json
      - tools/sync_docs.py
      - tools/sync_docs.py.lock
      - .github/workflows/validate-docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - package.json
      - package-lock.json
      - tools/sync_docs.py
      - tools/sync_docs.py.lock
      - .github/workflows/validate-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate Mintlify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - name: Install locked Node tools
        run: npm ci --ignore-scripts
      - name: Examine pages and internal links
        env:
          MINTLIFY_TELEMETRY_DISABLED: '1'
        run: npm run docs:check
