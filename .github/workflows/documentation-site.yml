name: Documentation Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-site-${{ github.ref }}
  cancel-in-progress: true

env:
  MINTLIFY_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Validate documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: docs/tooling/package-lock.json
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --ignore-scripts --prefix docs/tooling
      - name: Reject absent or stale site input and examine Mintlify
        run: npm run docs:check
      - name: Exercise missing-site and stale-deployment rejection cases
        run: uv run --locked pytest tools/python_checks/test_public_docs.py

  live:
    name: Examine live documentation
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read published main input for a manual candidate probe
        id: published
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: .site-expected
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
      - name: Reject stale or missing published content after the deploy interval
        env:
          EXPECTED_REPO: ${{ steps.published.outcome == 'success' && '.site-expected' || '.' }}
          SLOPSENTRAL_SITE_EXPECTED_COMMIT: ${{ steps.published.outputs.commit || github.sha }}
        run: >-
          uv run --locked --script tools/public_docs.py live
          --repo "$EXPECTED_REPO" --timeout 900
          > "$RUNNER_TEMP/documentation-live.json"
      - name: Keep the source-bound content receipt even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-live-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/documentation-live.json
          if-no-files-found: error
          retention-days: 30
