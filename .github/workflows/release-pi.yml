name: Release Slopsentral

on:
  workflow_run:
    workflows: [Validate Source]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Validate Source run whose retained release candidates to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-slopsentral
  cancel-in-progress: false

jobs:
  select:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - name: Select a validated unpublished shared version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked python -m tools.release_version select
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
          --github-output "$GITHUB_OUTPUT"

  release:
    needs: select
    if: needs.select.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - name: Admit the successful main run and original producer
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked --script tools/pi_candidate.py promote
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --run-id "$SOURCE_RUN_ID" --bundle "$RUNNER_TEMP/pi-candidate"
          --promotion-record "$RUNNER_TEMP/promotion.json" --github-output "$GITHUB_OUTPUT"
      - name: Admit the verified provider artifact attempt
        id: providers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked python -m tools.release_assets admit-run
          "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download verified Codex Copilot and Amp archives
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.providers.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/marketplace-candidate
      - name: Verify provider version source and bytes before publication
        env:
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          uv run --locked python -m tools.release_assets verify "$RUNNER_TEMP/marketplace-candidate" "$SOURCE_SHA" "$VERSION"
          cat "$RUNNER_TEMP/marketplace-candidate/SHA256SUMS" >> "$RUNNER_TEMP/pi-candidate/SHA256SUMS"
      - name: Admit the setup artifact attempt
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked python -m tools.setup_assets admit-run
          "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download the qualified native installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.setup.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/setup-candidate
      - name: Verify setup identity before publication
        run: |
          uv run --locked python -m tools.setup_assets verify "$RUNNER_TEMP/setup-candidate" "$RUNNER_TEMP/pi-candidate/candidate.json"
          cat "$RUNNER_TEMP/setup-candidate/SHA256SUMS" >> "$RUNNER_TEMP/pi-candidate/SHA256SUMS"
      - name: Create the source tag without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          VERSION: ${{ needs.select.outputs.version }}
        run: uv run --locked python -m tools.release_assets ensure-tag "$GITHUB_REPOSITORY" "slopsentral-v$VERSION" "$SOURCE_SHA"
      - name: Publish all retained artifacts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
          VERSION: ${{ needs.select.outputs.version }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          printf '%s\n' \
            "Unified Slopsentral $VERSION for Codex, GitHub Copilot, Amp, and Pi." \
            '' \
            "Changelog: https://github.com/$GH_REPO/blob/$SOURCE_SHA/CHANGELOG.md" \
            'Pi setup uses the installed host best-effort; no exact Pi version is required.' \
            'Install, update, and recover using the [Pi guide](https://github.com/amichne/slopsentral/blob/main/docs/pi-install.md).' \
            "Source: https://github.com/$GH_REPO/commit/$SOURCE_SHA" \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "slopsentral-v$VERSION" "$ARCHIVE" \
            "$RUNNER_TEMP/marketplace-candidate/slopsentral-codex.tar.gz" \
            "$RUNNER_TEMP/marketplace-candidate/slopsentral-github-copilot.tar.gz" \
            "$RUNNER_TEMP/marketplace-candidate/slopsentral-amp.tar.gz" \
            "$RUNNER_TEMP/marketplace-candidate/release-assets.json" \
            "$RUNNER_TEMP/pi-candidate/SHA256SUMS" "$RUNNER_TEMP/pi-candidate/candidate.json" \
            "$RUNNER_TEMP/setup-candidate/install-pi.sh" "$RUNNER_TEMP/setup-candidate/setup-pi.mts" \
            "$RUNNER_TEMP/setup-candidate/setup.json" "$RUNNER_TEMP/promotion.json" \
            --verify-tag --draft --title "Slopsentral $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Verify published downloads before making the release current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          gh release download "slopsentral-v$VERSION" --dir "$RUNNER_TEMP/downloaded"
          cmp "$RUNNER_TEMP/pi-candidate/SHA256SUMS" "$RUNNER_TEMP/downloaded/SHA256SUMS"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/pi-candidate/candidate.json" "$RUNNER_TEMP/downloaded/candidate.json"
          cmp "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/downloaded/promotion.json"
          cmp "$RUNNER_TEMP/marketplace-candidate/release-assets.json" "$RUNNER_TEMP/downloaded/release-assets.json"
          for file in install-pi.sh setup-pi.mts setup.json; do cmp "$RUNNER_TEMP/setup-candidate/$file" "$RUNNER_TEMP/downloaded/$file"; done
          gh release edit "slopsentral-v$VERSION" --draft=false --latest
      - name: Complete the Release Please PR lifecycle after publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.revision }}
        run: uv run --locked python -m tools.release_version finalize --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
