name: Release Slopsentral

on:
  workflow_run:
    workflows: [Validate Source]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Validate Source run whose retained archive to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pi
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - name: Admit the successful main run and original producer
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked --script tools/pi_candidate.py promote
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --run-id "$SOURCE_RUN_ID" --bundle "$RUNNER_TEMP/pi-candidate"
          --promotion-record "$RUNNER_TEMP/promotion.json" --github-output "$GITHUB_OUTPUT"
      - name: Admit the provider artifact attempt
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: uv run --locked python -m tools.release_assets admit-run "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download qualified Codex and Copilot archives
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.admission.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/marketplace-candidate
      - name: Verify provider identity before publication
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
        run: |
          uv run --locked python -m tools.release_assets unpack "$RUNNER_TEMP/marketplace-candidate" "$RUNNER_TEMP/marketplaces" "$SOURCE_SHA"
          cat "$RUNNER_TEMP/marketplace-candidate/SHA256SUMS" >> "$RUNNER_TEMP/pi-candidate/SHA256SUMS"
      - name: Admit the setup artifact attempt
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: uv run --locked python -m tools.setup_assets admit-run "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download the qualified native installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.setup.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/setup-candidate
      - name: Verify setup identity before publication
        run: |
          uv run --locked python -m tools.setup_assets verify "$RUNNER_TEMP/setup-candidate" "$RUNNER_TEMP/pi-candidate/candidate.json"
          cat "$RUNNER_TEMP/setup-candidate/SHA256SUMS" >> "$RUNNER_TEMP/pi-candidate/SHA256SUMS"
      - name: Create the tag at the admitted merged commit without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: uv run --locked python -m tools.release_assets ensure-tag "$GITHUB_REPOSITORY" "slopsentral-v$VERSION" "$SOURCE_SHA"
      - name: Publish the retained archive without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          BUILD_SHA: ${{ steps.candidate.outputs.source_revision }}
          VERSION: ${{ steps.candidate.outputs.version }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          printf '%s\n' \
            'Install native Pi content with the visible setup command in the [installation guide](https://slopsentral.michne.com/guides/pi).' \
            '' \
            '[Installation](https://slopsentral.michne.com/guides/install) | [Release contents and verification](https://slopsentral.michne.com/reference/releases)' \
            '' \
            'This canonical native set supersedes the retired Pi extension runtime. Its historical Pi-only downloads are removed after independent replacement verification; source tags remain recoverable.' \
            'Codex and Copilot archives contain the exact projected bytes tested by Validate Source. See release-assets.json for source identity and checksums.' \
            '' \
            "CI passed for [source $BUILD_SHA](https://github.com/$GH_REPO/commit/$BUILD_SHA)." \
            "The release tag targets [main commit $SOURCE_SHA](https://github.com/$GH_REPO/commit/$SOURCE_SHA)." \
            "The release includes \`SHA256SUMS\`, \`candidate.json\`, and \`promotion.json\` for archive identity and source provenance." \
            > "$RUNNER_TEMP/pi-release-notes.md"
          gh release create "slopsentral-v$VERSION" "$ARCHIVE" \
            "$RUNNER_TEMP/pi-candidate/SHA256SUMS" "$RUNNER_TEMP/pi-candidate/candidate.json" \
            "$RUNNER_TEMP/marketplace-candidate/slopsentral-codex.tar.gz" \
            "$RUNNER_TEMP/marketplace-candidate/slopsentral-github-copilot.tar.gz" \
            "$RUNNER_TEMP/marketplace-candidate/release-assets.json" \
            "$RUNNER_TEMP/setup-candidate/install-pi.sh" "$RUNNER_TEMP/setup-candidate/setup-pi.mts" \
            "$RUNNER_TEMP/setup-candidate/setup.json" "$RUNNER_TEMP/promotion.json" --verify-tag --draft \
            --title "Slopsentral $VERSION" \
            --notes-file "$RUNNER_TEMP/pi-release-notes.md"
      - name: Examine actual release downloads before making the set current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          gh release download "slopsentral-v$VERSION" --dir "$RUNNER_TEMP/downloaded"
          cmp "$RUNNER_TEMP/pi-candidate/SHA256SUMS" "$RUNNER_TEMP/downloaded/SHA256SUMS"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/pi-candidate/candidate.json" "$RUNNER_TEMP/downloaded/candidate.json"
          cmp "$RUNNER_TEMP/promotion.json" "$RUNNER_TEMP/downloaded/promotion.json"
          cmp "$RUNNER_TEMP/marketplace-candidate/release-assets.json" "$RUNNER_TEMP/downloaded/release-assets.json"
          for file in install-pi.sh setup-pi.mts setup.json; do cmp "$RUNNER_TEMP/setup-candidate/$file" "$RUNNER_TEMP/downloaded/$file"; done
          gh release edit "slopsentral-v$VERSION" --draft=false --latest
