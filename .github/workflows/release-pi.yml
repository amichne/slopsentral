name: Release Pi package

on:
  workflow_run:
    workflows: [Validate Source]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Validate Source run whose retained archive to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pi
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - name: Admit the successful main run and original producer
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          uv run --locked --script tools/pi_candidate.py promote
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --run-id "$SOURCE_RUN_ID" --bundle "$RUNNER_TEMP/pi-candidate"
          --promotion-record "$RUNNER_TEMP/promotion.json" --github-output "$GITHUB_OUTPUT"
      - name: Create the tag at the admitted merged commit without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          -f "ref=refs/tags/pi-v$VERSION" -f "sha=$SOURCE_SHA"
      - name: Publish the retained archive without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.candidate.outputs.merged_revision }}
          BUILD_SHA: ${{ steps.candidate.outputs.source_revision }}
          VERSION: ${{ steps.candidate.outputs.version }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          printf '%s\n' \
            'Install this Pi package without a source checkout:' \
            '' \
            '```bash' \
            "pi install npm:slopsentral-pi@https://github.com/$GH_REPO/releases/download/pi-v$VERSION/slopsentral-pi-$VERSION.tgz" \
            '```' \
            '' \
            "[Pi guide](https://github.com/$GH_REPO/blob/pi-v$VERSION/docs/pi-harness.md) | [README](https://github.com/$GH_REPO/blob/pi-v$VERSION/README.md)" \
            '' \
            "CI passed for [source $BUILD_SHA](https://github.com/$GH_REPO/commit/$BUILD_SHA)." \
            "The release tag targets [main commit $SOURCE_SHA](https://github.com/$GH_REPO/commit/$SOURCE_SHA)." \
            "The release includes \`SHA256SUMS\`, \`candidate.json\`, and \`promotion.json\` for archive identity and source provenance." \
            > "$RUNNER_TEMP/pi-release-notes.md"
          gh release create "pi-v$VERSION" "$ARCHIVE" \
            "$RUNNER_TEMP/pi-candidate/SHA256SUMS" "$RUNNER_TEMP/pi-candidate/candidate.json" \
            "$RUNNER_TEMP/promotion.json" --verify-tag --latest \
            --title "Slopsentral Pi $VERSION" \
            --notes-file "$RUNNER_TEMP/pi-release-notes.md"
