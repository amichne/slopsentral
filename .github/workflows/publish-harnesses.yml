name: Publish Harnesses

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.agents/plugins/**'
      - '.github/plugin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-harnesses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install schema validation dependencies
        run: npm ci

      - name: Validate source marketplace
        run: node tools/validate-source-graph.mjs

  publish:
    name: Publish ${{ matrix.harness }}
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: codex
            branch: harness/codex
          - harness: github-copilot
            branch: harness/github-copilot

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Project ${{ matrix.harness }} marketplace
        id: projection
        uses: amichne/projeKtor@eb3799c2bc60b4803c84fded0b6f4cd587bd0702 # v1.2.1
        with:
          source: .
          harness: ${{ matrix.harness }}
          version: v1.2.1

      - name: Publish ${{ matrix.branch }}
        env:
          PROJECTION_PATH: ${{ steps.projection.outputs.projection-path }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          .github/scripts/publish-harness-branch \
            "${PROJECTION_PATH}" \
            "${TARGET_BRANCH}" \
            main \
            "${GITHUB_SHA}"

      - name: Archive projection with executable permissions
        env:
          PROJECTION_PATH: ${{ steps.projection.outputs.projection-path }}
          HARNESS: ${{ matrix.harness }}
        run: tar -cf "$RUNNER_TEMP/marketplace-$HARNESS.tar" -C "$PROJECTION_PATH" .

      - name: Upload projection for main
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ matrix.harness }}
          path: ${{ runner.temp }}/marketplace-${{ matrix.harness }}.tar
          if-no-files-found: error
          retention-days: 1

  publish-main:
    name: Publish both marketplaces to main
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download this run's projections
        uses: actions/download-artifact@v4
        with:
          pattern: marketplace-*
          path: ${{ runner.temp }}/marketplace-archives
          merge-multiple: true

      - name: Extract both projections
        run: |
          mkdir -p "$RUNNER_TEMP/marketplaces"
          tar -xf "$RUNNER_TEMP/marketplace-archives/marketplace-codex.tar" -C "$RUNNER_TEMP/marketplaces"
          tar -xf "$RUNNER_TEMP/marketplace-archives/marketplace-github-copilot.tar" -C "$RUNNER_TEMP/marketplaces"

      - name: Publish generated trees to main
        env:
          PROJECTION_PATH: ${{ runner.temp }}/marketplaces
        run: .github/scripts/publish-marketplaces-main "$PROJECTION_PATH" "$GITHUB_SHA"
