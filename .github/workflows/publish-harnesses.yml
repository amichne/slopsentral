name: Publish Harnesses

on:
  workflow_run:
    workflows: [Validate Source]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Validate Source run
        required: true
        type: string
      revision:
        description: Exact source revision of that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-harnesses-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish qualified marketplaces
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.revision }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
      - name: Admit the full successful main validation
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m tools.release_assets admit-run "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download tested provider archives from that run
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.admission.outputs.artifact }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/marketplace-candidate
      - name: Verify identity and unpack tested bytes
        run: uv run --locked python -m tools.release_assets unpack "$RUNNER_TEMP/marketplace-candidate" "$RUNNER_TEMP/marketplaces" "$SOURCE_SHA"
      - name: Publish Codex branch
        run: |
          mkdir -p "$RUNNER_TEMP/codex"
          cp -R "$RUNNER_TEMP/marketplaces/.agents" "$RUNNER_TEMP/codex/"
          uv run --locked tools/publish.py harness "$RUNNER_TEMP/codex" harness/codex main "$SOURCE_SHA"
      - name: Publish Copilot branch
        run: |
          mkdir -p "$RUNNER_TEMP/copilot"
          cp -R "$RUNNER_TEMP/marketplaces/.github" "$RUNNER_TEMP/copilot/"
          uv run --locked tools/publish.py harness "$RUNNER_TEMP/copilot" harness/github-copilot main "$SOURCE_SHA"
      - name: Publish generated trees to main
        run: uv run --locked tools/publish.py main "$RUNNER_TEMP/marketplaces" "$SOURCE_SHA"
