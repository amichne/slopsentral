import groovy.json.JsonOutput
import java.util.Locale

gradle.projectsLoaded {
    gradle.rootProject.tasks.register("codexDynamicToolsDiscoveryProbe") {
        group = "help"
        description = "Emits machine-readable Gradle task metadata for Codex."
        doLast {
            def query = (System.getenv("CODEX_GRADLE_DISCOVERY_QUERY") ?: "")
                .toLowerCase(Locale.ROOT)
            def limit = Integer.parseInt(System.getenv("CODEX_GRADLE_DISCOVERY_LIMIT"))
            def matching = gradle.rootProject.allprojects
                .collectMany { project ->
                    project.tasks.collect { task ->
                        [
                            path: task.path,
                            name: task.name,
                            projectPath: project.path,
                            group: task.group,
                            description: task.description,
                        ]
                    }
                }
                .findAll { task ->
                    task.path != ":codexDynamicToolsDiscoveryProbe" &&
                        (query.isEmpty() || task.values().any { value ->
                            value != null && value.toString().toLowerCase(Locale.ROOT).contains(query)
                        })
                }
                .unique { task -> task.path }
                .sort { left, right -> left.path <=> right.path }
            def document = [
                tasks: matching.take(limit),
                truncated: matching.size() > limit,
            ]
            println("CODEX_GRADLE_DISCOVERY:" + JsonOutput.toJson(document))
        }
    }
}
