jobs:
  native:
    outputs:
      executable: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - id: archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
  assembly:
    needs: native
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native.outputs.executable }}
