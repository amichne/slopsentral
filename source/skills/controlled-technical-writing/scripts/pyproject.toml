[project]
name = "slopsentral-vale-setup"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==8.4.2"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["install_vale.py", "tests/test_vale_setup.py"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["install_vale.py", "tests/test_vale_setup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/test_vale_setup.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
