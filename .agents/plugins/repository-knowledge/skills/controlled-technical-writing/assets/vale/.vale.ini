# This configuration uses only local, bundled rules.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Slopsentral
IgnoredScopes = code, tt, kbd, frontmatter

[*.{md,mdx,txt}]
BasedOnStyles = Vale, Slopsentral
Slopsentral.ProcedureLength = NO
Slopsentral.CommitWrap = NO

[**/tutorials/**/*.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Tutorial
Slopsentral.ProcedureLength = YES

[**/how-to/**/*.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, HowTo
Slopsentral.ProcedureLength = YES

[**/reference/**/*.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Reference

[**/explanation/**/*.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Explanation

[COMMIT_EDITMSG]
BasedOnStyles = Commits, Conventional, Slopsentral
View = Commit
Slopsentral.CommitWrap = YES
