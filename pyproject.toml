[project]
name = "slopsentral-automation"
version = "4.0.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.14.0",
    "pyright[nodejs]==1.1.407",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "types-jsonschema==4.26.0.20261006",
    "markdown-it-py==4.0.0",
]
refactor = ["libcst==1.8.5"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
extraPaths = ["source/skills/kotlin-gradle-validation/scripts", "source/skills/controlled-technical-writing/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["tools/python_checks", "tools/check.py", "tools/setup.py", "tools/ci.py", "tools/publish.py", "tools/verify_marketplaces.py", "tools/install_skill.py", "tools/install_agents_hook.py", "tools/install_global_agents.py", "source/hooks/agents-md-scope.py", "tools/compile_kotlin_concepts.py", "source/skills/python-tooling", "source/hooks/gradle-check-green.py", "source/hooks/gradle-wrapper-integrity.py", "source/hooks/source-graph-valid.py", "source/skills/kotlin-gradle-validation/scripts/run_gradle_task.py", "source/skills/kotlin-gradle-validation/scripts/gradle_repository.py", "source/agents/codebase-navigator/scripts/setup-local-nav.py", "source/skills/controlled-technical-writing/scripts/install_vale.py", "source/skills/controlled-technical-writing/scripts/glossary_json.py", "source/skills/controlled-technical-writing/scripts/tests/test_glossary_json.py", "source/skills/controlled-technical-writing/scripts/tests/test_vale_setup.py"]
exclude = ["**/fixtures", "**/.venv"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportUnusedCallResult = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["tools/python_checks/**/*.py", "tools/check.py", "tools/setup.py", "tools/ci.py", "tools/publish.py", "tools/verify_marketplaces.py", "tools/install_skill.py", "tools/install_agents_hook.py", "tools/install_global_agents.py", "source/hooks/agents-md-scope.py", "tools/compile_kotlin_concepts.py", "source/skills/python-tooling/**/*.py", "source/hooks/gradle-*.py", "source/hooks/source-graph-valid.py", "source/skills/kotlin-gradle-validation/scripts/run_gradle_task.py", "source/skills/kotlin-gradle-validation/scripts/gradle_repository.py", "source/agents/codebase-navigator/scripts/setup-local-nav.py"]
extend-exclude = ["**/fixtures"]

[tool.ruff.lint]
select = ["ALL"]
# Documentation style is prose policy; formatter owns line layout. CLI output
# and explicit argv subprocesses are intentional at effect boundaries.
ignore = ["D", "COM812", "ISC001", "E501", "T201", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]
"**/standalone.py" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
pythonpath = [".", "source/skills/kotlin-gradle-validation/scripts", "source/skills/controlled-technical-writing/scripts"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["tools/python_checks", "source/skills/python-tooling/assets", "source/skills/controlled-technical-writing/scripts/tests"]
python_files = ["test_*.py", "standalone.py"]
filterwarnings = ["error"]
