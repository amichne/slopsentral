extends: existence
message: "Glossary markers belong only in the glossary; use the canonical term without markers."
level: error
nonword: true
# A marker starts with a letter, so section citations such as 'RFC 4291 §2.7'
# followed by a later '§6' on the same line are not markers.
tokens:
  - '\x{00A7}[A-Za-z][^\x{00A7}\n\[\]()]*\x{00A7}'
